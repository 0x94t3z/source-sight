<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Sight</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <img class="brand-icon" src="icon-48.png" alt="" />
        <div>
          <h1>Source Sight</h1>
          <p>Private AI image detection</p>
        </div>
      </div>
      <div id="status" class="status">Checking model...</div>
      <button id="setup" type="button">Prepare local model</button>
      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <label class="row">
          <span>Enable scanning</span>
          <input id="enabled" type="checkbox" />
        </label>
        <label class="row">
          <span>Show uncertain results</span>
          <input id="showUncertain" type="checkbox" />
        </label>
        <label class="stack">
          <span>Images per page</span>
          <input id="maxImagesPerPage" type="number" min="1" max="500" step="1" />
        </label>
        <p id="saved" class="saved" role="status">Settings apply automatically.</p>
      </section>
    </main>
  </body>
</html>
