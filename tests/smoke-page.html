<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Sight Smoke Page</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #172033;
        background: #f7fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .intro {
        margin: 0 0 24px;
        color: #526070;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        min-width: 0;
        padding: 10px;
        border: 1px solid #d7e0ea;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }

      .card p {
        min-height: 32px;
        margin: 0 0 10px;
        color: #526070;
        font-size: 12px;
        line-height: 1.35;
      }

      .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Source Sight Smoke Page</h1>
      <p class="intro">Two fixed fixtures for checking local image analysis.</p>
      <div class="grid">
        <article class="card">
          <h2>AI-generated costume</h2>
          <p>Original generated red-and-blue costume portrait.</p>
          <img id="ai-generated" alt="AI-generated costume portrait" width="640" height="512" src="/tests/fixtures/ai-superhero-costume.png" />
        </article>
        <article class="card">
          <h2>Real cosplay photograph</h2>
          <p>Real Spider-Man cosplay portrait from Unsplash.</p>
          <img id="real-photograph" alt="Real cosplay photograph fixture" width="640" height="640" src="/tests/fixtures/real-spiderman-cosplay.jpg" />
        </article>
      </div>
    </main>
    <script>
    </script>
  </body>
</html>
