<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Sight Smoke Page</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #172033;
        background: #f7fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .intro {
        margin: 0 0 24px;
        color: #526070;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        min-width: 0;
        padding: 10px;
        border: 1px solid #d7e0ea;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }

      .card p {
        min-height: 32px;
        margin: 0 0 10px;
        color: #526070;
        font-size: 12px;
        line-height: 1.35;
      }

      .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Source Sight Smoke Page</h1>
      <p class="intro">Three fixed fixtures for checking local image analysis.</p>
      <div class="grid">
        <article class="card">
          <h2>AI-generated fixture</h2>
          <p>Generated image with a C2PA marker.</p>
          <img id="ai-generated" alt="AI-generated fixture" width="640" height="640" src="/tests/fixtures/ai-generated.png" />
        </article>
        <article class="card">
          <h2>Real photograph</h2>
          <p>Known real-world landscape photograph.</p>
          <img id="real-photograph" alt="Real photograph fixture" width="640" height="427" src="/tests/fixtures/real-photograph.jpg" />
        </article>
        <article class="card">
          <h2>Synthetic canvas</h2>
          <p>Deterministic raster image generated in this page.</p>
          <img id="synthetic" alt="Synthetic canvas fixture" width="640" height="480" />
        </article>
      </div>
    </main>
    <script>
      function makeRasterImage(kind) {
        const canvas = document.createElement("canvas");
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext("2d");

        const gradient = ctx.createLinearGradient(0, 0, 640, 480);
        gradient.addColorStop(0, kind === "portrait" ? "#f7fafc" : "#111827");
        gradient.addColorStop(1, kind === "portrait" ? "#1f6feb" : "#7c3aed");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 640, 480);

        ctx.globalAlpha = 0.55;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(210, 220, 90, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = kind === "portrait" ? "#ef4444" : "#22c55e";
        ctx.beginPath();
        ctx.arc(410, 260, 120, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffffff";
        ctx.font = "700 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText(kind === "portrait" ? "Source Sight" : "AI test image", 320, 250);

        return canvas.toDataURL("image/png");
      }

      document.getElementById("synthetic").src = makeRasterImage("portrait");
    </script>
  </body>
</html>
